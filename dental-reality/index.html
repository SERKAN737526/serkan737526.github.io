      function (x) { go.disabled = false; go.textContent = 'Gir'; err.textContent = x && x.message && /tarayıcı/.test(x.message) ? x.message : 'Şifre yanlış.'; });
  });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (x) { }
  if (saved) { go.disabled = true; go.textContent = 'Açılıyor…'; open(saved).then(show, function () { try { localStorage.removeItem(KEY); } catch (x) { } go.disabled = false; go.textContent = 'Gir'; }); }
})();
</script>
